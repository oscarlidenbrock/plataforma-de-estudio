<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapa conceptual de la naturaleza y objetivo del procedimiento administrativo</title>
  <desc id="desc">Esquema con una idea central y cuatro bloques: naturaleza juridica, garantias, eficacia y base normativa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf4ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="760" rx="28" fill="url(#bg)"/>
  <rect x="40" y="40" width="880" height="680" rx="24" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <text x="480" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#10203a">Procedimiento administrativo</text>
  <text x="480" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5f6b7a">Naturaleza instrumental, garantista y ordenadora</text>

  <rect x="300" y="180" width="360" height="112" rx="20" fill="#1f6feb"/>
  <text x="480" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Idea central</text>
  <text x="480" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#eef5ff">El procedimiento transforma</text>
  <text x="480" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#eef5ff">el poder administrativo en decision</text>
  <text x="480" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#eef5ff">valida, eficaz y controlable</text>

  <line x1="480" y1="292" x2="190" y2="390" stroke="#91b4ea" stroke-width="4"/>
  <line x1="480" y1="292" x2="770" y2="390" stroke="#91b4ea" stroke-width="4"/>
  <line x1="480" y1="292" x2="285" y2="580" stroke="#91b4ea" stroke-width="4"/>
  <line x1="480" y1="292" x2="675" y2="580" stroke="#91b4ea" stroke-width="4"/>

  <rect x="70" y="365" width="240" height="150" rx="18" fill="#f6f9fd" stroke="#d7dee8" stroke-width="2"/>
  <text x="190" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#123e7c">Naturaleza</text>
  <text x="100" y="435" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• instrumental</text>
  <text x="100" y="463" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• garantista</text>
  <text x="100" y="491" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• ordenadora</text>

  <rect x="650" y="365" width="240" height="150" rx="18" fill="#f6f9fd" stroke="#d7dee8" stroke-width="2"/>
  <text x="770" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#123e7c">Garantias</text>
  <text x="680" y="435" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• audiencia y alegaciones</text>
  <text x="680" y="463" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• prueba y motivacion</text>
  <text x="680" y="491" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• recursos y control</text>

  <rect x="135" y="545" width="300" height="130" rx="18" fill="#f6f9fd" stroke="#d7dee8" stroke-width="2"/>
  <text x="285" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#123e7c">Objetivo</text>
  <text x="163" y="615" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• eficacia administrativa</text>
  <text x="163" y="643" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• proteccion del ciudadano</text>

  <rect x="525" y="545" width="300" height="130" rx="18" fill="#f6f9fd" stroke="#d7dee8" stroke-width="2"/>
  <text x="675" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#123e7c">Base normativa</text>
  <text x="553" y="615" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• arts. 103, 105 y 106 CE</text>
  <text x="553" y="643" font-family="Arial, sans-serif" font-size="18" fill="#18212f">• Ley 39/2015 y Ley 40/2015</text>
</svg>
