<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Esquema del principio de oficialidad</title>
  <desc id="desc">Mapa visual con las bases, manifestaciones y limites del principio de oficialidad en el procedimiento administrativo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eef4fb" />
    </linearGradient>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#bg)" />
  <rect x="290" y="40" width="380" height="92" rx="18" fill="#163968" />
  <text x="480" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Principio de oficialidad</text>
  <text x="480" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#dce9ff">La Administracion impulsa, ordena e instruye el procedimiento sin depender de la iniciativa del interesado</text>

  <line x1="480" y1="132" x2="480" y2="176" stroke="#5d7fb0" stroke-width="3" />

  <rect x="56" y="190" width="258" height="162" rx="18" fill="#ffffff" stroke="#cfdced" stroke-width="2" />
  <text x="84" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17335d">Base normativa</text>
  <text x="84" y="265" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Art. 103.1 CE</text>
  <text x="84" y="294" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Arts. 58 y ss. Ley 39/2015</text>
  <text x="84" y="323" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Arts. 71 y 75 Ley 39/2015</text>

  <rect x="351" y="190" width="258" height="162" rx="18" fill="#ffffff" stroke="#cfdced" stroke-width="2" />
  <text x="379" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17335d">Como actua</text>
  <text x="379" y="265" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Iniciacion de oficio</text>
  <text x="379" y="294" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Impulso de oficio</text>
  <text x="379" y="323" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Instruccion e investigacion de oficio</text>

  <rect x="646" y="190" width="258" height="162" rx="18" fill="#ffffff" stroke="#cfdced" stroke-width="2" />
  <text x="674" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17335d">Que persigue</text>
  <text x="674" y="265" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Evitar paralizacion</text>
  <text x="674" y="294" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Aclarar los hechos</text>
  <text x="674" y="323" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Llegar a una decision fundada</text>

  <line x1="185" y1="352" x2="185" y2="390" stroke="#5d7fb0" stroke-width="3" />
  <line x1="480" y1="352" x2="480" y2="390" stroke="#5d7fb0" stroke-width="3" />
  <line x1="775" y1="352" x2="775" y2="390" stroke="#5d7fb0" stroke-width="3" />

  <rect x="56" y="404" width="258" height="170" rx="18" fill="#ffffff" stroke="#cfdced" stroke-width="2" />
  <text x="84" y="442" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17335d">No significa</text>
  <text x="84" y="479" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Prescindir del interesado</text>
  <text x="84" y="508" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Omitir audiencia o prueba</text>
  <text x="84" y="537" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Actuar arbitrariamente</text>

  <rect x="351" y="404" width="258" height="170" rx="18" fill="#ffffff" stroke="#cfdced" stroke-width="2" />
  <text x="379" y="442" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17335d">Ideas de examen</text>
  <text x="379" y="479" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- El expediente no depende solo de las partes</text>
  <text x="379" y="508" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- La Administracion mueve e instruye</text>
  <text x="379" y="537" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Siempre con contradiccion y defensa</text>

  <rect x="646" y="404" width="258" height="170" rx="18" fill="#ffffff" stroke="#cfdced" stroke-width="2" />
  <text x="674" y="442" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17335d">Preceptos clave</text>
  <text x="674" y="479" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Art. 58 inicio de oficio</text>
  <text x="674" y="508" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Art. 71 impulso de oficio</text>
  <text x="674" y="537" font-family="Arial, sans-serif" font-size="18" fill="#33455f">- Art. 75 instruccion de oficio</text>
</svg>
