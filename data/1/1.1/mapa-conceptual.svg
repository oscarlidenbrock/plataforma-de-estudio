<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1080" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F0FF"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <linearGradient id="main" x1="430" y1="120" x2="770" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#0F4FAF"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1D2A3A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="392" y="108" width="416" height="112" rx="24" fill="url(#main)"/>
    <text x="600" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Derecho administrativo</text>
    <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#DCE9FF">Rama del Derecho público que organiza la Administración y somete su actuación a la ley y al interés general</text>
  </g>
  <path d="M600 220V282" stroke="#8FB8FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 282H220V314" stroke="#8FB8FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 282H980V314" stroke="#8FB8FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 282V314" stroke="#8FB8FF" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="88" y="314" width="264" height="150" rx="22" fill="#FFFFFF"/>
    <text x="220" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1A2B45">Qué regula</text>
    <text x="220" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Organización administrativa</text>
    <text x="220" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Potestades públicas</text>
    <text x="220" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Procedimiento y control</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="468" y="314" width="264" height="150" rx="22" fill="#FFFFFF"/>
    <text x="600" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1A2B45">Por qué existe</text>
    <text x="600" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Satisface intereses generales</text>
    <text x="600" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Limita el poder administrativo</text>
    <text x="600" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Protege derechos ciudadanos</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="848" y="314" width="264" height="150" rx="22" fill="#FFFFFF"/>
    <text x="980" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1A2B45">Cómo actúa</text>
    <text x="980" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Actos administrativos</text>
    <text x="980" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Reglamentos</text>
    <text x="980" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4D5D73">• Ejecución y revisión</text>
  </g>
  <path d="M220 464V520H980V520" stroke="#B9D2F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 464V520" stroke="#B9D2F7" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="200" y="520" width="800" height="116" rx="24" fill="#0F1723"/>
    <text x="600" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Idea clave para memorizar</text>
    <text x="600" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#D8E2F0">El Derecho administrativo otorga poderes a la Administración</text>
    <text x="600" y="628" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#D8E2F0">y, al mismo tiempo, impone límites, procedimiento, motivación y control judicial.</text>
  </g>
</svg>
